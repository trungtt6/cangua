name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Ludo Online Chupamobile/Library
          key: Library-Android-${{ hashFiles('Ludo Online Chupamobile/Assets/**', 'Ludo Online Chupamobile/Packages/**', 'Ludo Online Chupamobile/ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Ludo Online Chupamobile
          targetPlatform: Android
          buildMethod: AndroidBuild.PerformAndroidBuild
          buildName: LudoOnline
          versioning: Semantic
          androidExportType: androidPackage
          androidKeystoreName: keystore.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEY_ALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEY_ALIAS_PASS }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LudoOnline-Android
          path: build/Android/*.apk
          retention-days: 30
